name: Benchmarks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'benchmark/**'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project benchmark/runbenchmarks.jl
